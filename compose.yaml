name: flightdata

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: flight-data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flight-data"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    # Share only the database container's network namespace. This preserves the
    # existing localhost database connection without publishing PostgreSQL.
    network_mode: "service:db"
    restart: "no"
    init: true
    volumes:
      - runtime-data:/app/runtime-outputs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  runtime-data:

# Compose reads this value from the VM shell and mounts it as a file only in
# the PostgreSQL container. The Python app retrieves the same value directly
# from Google Secret Manager through the VM's attached service account.
secrets:
  db_password:
    environment: DB_PASSWORD

